apiVersion: v1
kind: Service

metadata:
  name: api-gateway
  namespace: cloudcart-dev

  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: cloudcart

spec:
  type: ClusterIP

  selector:
    app: api-gateway

  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP